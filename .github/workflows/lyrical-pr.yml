name: lyrical-preview

# Build native Lyrical packages before any publishing is enabled. No upload step,
# no OIDC permissions, and no Jazzy channel in the build or test environment.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyrical-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: lyrical (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/.ghcup
          sudo apt-get clean
          df -h /
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.75.0
          locked: true
      - name: Stage Lyrical source recipes
        run: pixi run python scripts/gen_lyrical.py vpi ros-lyrical-isaac-ros-common
      - name: Build and test Lyrical foundation
        env:
          CONDA_OVERRIDE_CUDA: "13.3"
        run: |
          for name in vpi ros-lyrical-isaac-ros-common; do
            pixi run rattler-build build \
              --recipe "recipes-lyrical/$name/recipe.yaml" \
              --output-dir output-lyrical \
              --target-platform "${{ matrix.platform }}" \
              -m variants.yaml -m variants-lyrical.yaml \
              --test skip
            for pkg in output-lyrical/*/"$name"-*.conda; do
              pixi run rattler-build test --package-file "$pkg" \
                -c ./output-lyrical \
                -c https://prefix.dev/robostack-lyrical \
                -c conda-forge
            done
          done
      - name: Upload diagnostics (not packages)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lyrical-build-log-${{ matrix.platform }}
          path: output-lyrical/rattler-build-log.txt
          if-no-files-found: ignore
