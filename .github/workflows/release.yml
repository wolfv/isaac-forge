name: release

# Builds every recipe in recipes/ and publishes the new ones to
# https://prefix.dev/channels/isaac-forge.
#
# The filename matters: the prefix.dev trusted publisher is bound to `release.yml`.
# Renaming this file breaks authentication.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required for trusted publishing. rattler-build exchanges the GitHub OIDC token
  # with prefix.dev itself, so there is no API key anywhere in this repo.
  id-token: write

# Never run two publishes at once, and never cancel one midway through uploading.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      # The GXF, NITROS and VPI host environments are multi-GB each, and VPI alone
      # unpacks to ~1 GB. A default runner does not have room. dotnet + android + ghc
      # are ~25 GB between them, which is enough; the hosted tool cache is deliberately
      # left alone because setup-pixi installs into it.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - uses: prefix-dev/setup-pixi@v0.8.14
        # A hang here should fail fast rather than sit on the job timeout.
        timeout-minutes: 15
        with:
          # pixi.lock pins rattler-build, so CI builds with the same version as local.
          locked: true

      # -c ./output is what lets recipes resolve against packages built earlier in this
      # same run. rattler-build indexes the directory itself, but it has to exist before
      # being named as a channel.
      #
      # The isaac-forge channel is deliberately NOT a read channel here: it is private,
      # and its repodata returns 401. Trusted publishing grants upload rights at upload
      # time via OIDC, not read access during the build. That also means
      # `--skip-existing all` cannot see what is already published, so this is `local`
      # -- see the note on the publish step below.
      # Tests are deliberately deferred to the next step rather than run inline, and the
      # reason is a real ordering limitation rather than a preference.
      #
      # rattler-build orders the recipes in a --recipe-dir by their *build* dependency
      # graph, but a test environment has to install the package's whole *run* closure.
      # For the ament_python packages those differ: isaac_ros_manipulation_orchestration
      # builds against nothing but python/pip/setuptools, and only at test time does it
      # need isaac_ros_manipulation_ros_python_utils -> isaac_ros_test. There is no
      # build-graph edge to order on, so the alphabetically earlier orchestration is built
      # and tested before isaac-ros-test exists, and its test env cannot solve:
      #
      #   Test failed: failed to setup test environment: Cannot solve the request because
      #   of: ros-jazzy-isaac-ros-manipulation-orchestration ... would require
      #   ros-jazzy-isaac-ros-test *, for which no candidates were found.
      #
      # Building everything first and testing afterwards removes the ordering question
      # entirely -- by then every package is in ./output. This keeps the tests rather than
      # dropping them, which a bare `--test skip` would do.
      - name: Build all recipes
        run: |
          mkdir -p output
          pixi run rattler-build build \
            --recipe-dir recipes \
            --output-dir output \
            -m variants.yaml \
            --skip-existing local \
            --test skip \
            -c ./output \
            -c https://prefix.dev/robostack-jazzy \
            -c conda-forge

      # Every package's own tests, now that the whole set exists to resolve against.
      # Runs them all before failing so one broken package reports as one failure rather
      # than hiding the rest.
      - name: Test all built packages
        run: |
          shopt -s nullglob
          pkgs=(output/*/*.conda)
          echo "testing ${#pkgs[@]} package(s)"
          failed=()
          for p in "${pkgs[@]}"; do
            if ! pixi run rattler-build test \
                 --package-file "$p" \
                 -c ./output \
                 -c https://prefix.dev/robostack-jazzy \
                 -c conda-forge; then
              failed+=("$(basename "$p")")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::${#failed[@]} package(s) failed their tests:"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi
          echo "all ${#pkgs[@]} packages passed their tests"

      # Build trees are large and are not needed to upload.
      - name: Drop build trees
        if: always()
        run: rm -rf output/bld output/src_cache output/.tmp

      # KNOWN LIMITATION while the channel is private: versions are fixed and build
      # numbers are 0, so every push to main rebuilds identical filenames and this step
      # will report duplicates once the channel is populated. The clean fix is to make
      # the isaac-forge channel readable, then restore `--skip-existing all` with it as
      # a read channel above, which makes a no-op push upload nothing at all.
      - name: Publish new packages to prefix.dev/isaac-forge
        run: |
          shopt -s nullglob
          pkgs=(output/*/*.conda)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "No new packages -- everything already exists in the channel."
            exit 0
          fi
          echo "Publishing ${#pkgs[@]} package(s):"
          printf '  %s\n' "${pkgs[@]}"
          pixi run rattler-build upload prefix -c isaac-forge "${pkgs[@]}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rattler-build-log
          path: output/rattler-build-log.txt
          if-no-files-found: ignore
          retention-days: 14
