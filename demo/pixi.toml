[workspace]
name = "isaac-forge-demo"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-rclcpp-components = "*"
ros-jazzy-cv-bridge = "*"
ros-jazzy-image-transport = "*"
ros-jazzy-camera-info-manager = "*"
ros-jazzy-message-filters = "*"
ros-jazzy-vision-msgs = "*"
cuda-cudart = "13.*"
libnpp = "*"
libcufft = "*"
libcusolver = "*"
libcublas = "*"
python = "3.12.*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-tf2-eigen = "*"
ros-jazzy-tf2-geometry-msgs = "*"
ros-jazzy-stereo-msgs = "*"
ros-jazzy-image-geometry = "*"
ros-jazzy-sensor-msgs-py = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-visualization-msgs = "*"
ros-jazzy-foxglove-bridge = "*"
ros-jazzy-rosbag2-storage-mcap = "*"

[tasks.setup]
description = "Fetch the Isaac ROS debs and overlay them onto this environment"
cmd = "./setup.sh"

[tasks.check]
description = "Verify the overlay: ROS sees the packages, NITROS links, CUDA status"
cmd = "python check.py"

[tasks.demo]
description = "Start a component container and load the Isaac ResizeNode into it"
cmd = "bash run_demo.sh"

[tasks.e2e]
description = "End-to-end GPU test: push an image through ResizeNode and verify the result"
cmd = "bash e2e.sh"
