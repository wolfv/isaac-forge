[workspace]
name = "isaac-forge-pose"
description = "Resolve the Isaac ROS pose-estimation packages from the built channel and load them"
channels = ["../output", "https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

# The vendored NVIDIA binaries are built on Ubuntu 24.04 and reference GLIBC_2.38,
# declared as `__glibc >=2.38`. pixi's default floor is lower.
[system-requirements]
libc = { family = "glibc", version = "2.38" }

# All five packages in NVIDIA-ISAAC-ROS/isaac_ros_pose_estimation, plus the two
# isaac_ros_dnn_inference packages that had to be built to reach them. If this
# environment solves, the seven are mutually consistent and consistent with
# robostack-jazzy; `pixi run check` then proves the components load.
#
# What is deliberately absent: isaac_ros_tensor_rt and isaac_ros_triton. Nothing here
# links them -- see the two demotion patches under recipes/ -- but the reference launch
# graphs compose them as separate nodes, so a *pipeline* still waits on TensorRT even
# though every package in it is built. See README.md.
[dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-rclcpp-components = "*"
python = "3.12.*"

ros-jazzy-isaac-ros-pose-proc = "*"
ros-jazzy-isaac-ros-dope = "*"
ros-jazzy-isaac-ros-centerpose = "*"
ros-jazzy-isaac-ros-foundationpose = "*"
ros-jazzy-isaac-ros-foundationpose-models-install = "*"

ros-jazzy-isaac-ros-tensor-proc = "*"
ros-jazzy-isaac-ros-dnn-image-encoder = "*"

# A second line of defence behind the unique container name check.py uses. A domain of
# its own keeps this environment from even seeing containers belonging to other Isaac
# environments on the same machine -- and those exist: the `manip`, `slam` and `bench`
# checks all leave component_containers running, and every one of them answers to the
# node name `/ComponentManager`. Without isolation, `ros2 component load` reaches a
# container whose prefix lacks these packages and reports "Could not find requested
# resource in ament index", which reads exactly like a packaging bug here and is not one.
#
# LOCALHOST discovery on top, so nothing on the network can join either.
[activation.env]
ROS_DOMAIN_ID = "89"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"

[tasks.check]
description = "List the packages, load every C++ composable node, check the generated service type"
cmd = "python check.py"
