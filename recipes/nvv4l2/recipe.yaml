schema_version: 1

# Repacked from the official Isaac ROS debian package.
#
# Generated by scripts/gen_repack.py -- edit the generator, not this file.
#
# The binaries are NVIDIA's own, unmodified except for RUNPATH rewriting, which is
# required to make them relocatable inside a conda prefix (see relink.py).

context:
  version: "8.1.0"

package:
  name: nvv4l2
  version: ${{ version }}

source:
  # nvv4l2
  - url: https://isaac.download.nvidia.com/isaac-ros/release-4/pool/main/n/nvv4l2/nvv4l2_8.1.0_amd64.deb
    file_name: pkg0.deb
    sha256: 3689455c4265e9400c8485f4c8ea27685c2b86c0371996f27bf28a275c70754e

build:
  number: 0
  script: build.sh
  dynamic_linking:
    # NVIDIA's binaries are relinked by relink.py, not by rattler-build.
    binary_relocation: false
    missing_dso_allowlist:
      - libcuda.so.*
      - libnvidia-*.so.*
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*
      - libcvcuda.so.*
      - libnvcv_types.so.*
      - libopencv_*.so.406*

requirements:
  build:
    - libarchive          # bsdtar, reads .deb directly
    - patchelf
    - python
  run:
    # Built on Ubuntu 24.04, so the binaries reference GLIBC_2.38 symbols. This is
    # a hard requirement on the host glibc, hence a run dep rather than a
    # run_constraints entry.
    - __glibc >=2.38
    - libv4l

tests:
  - package_contents:
      lib:
        - cuvidv4l2
        - nvbuf_fdmap
        - nvbufsurface
        - nvbufsurftransform
        - nvv4l2
        - nvv4lconvert

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS
  summary: cuvid v4l2 libs
  license: Apache-2.0
