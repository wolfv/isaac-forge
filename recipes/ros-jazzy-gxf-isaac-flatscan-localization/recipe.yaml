schema_version: 1

# Repacked from the official Isaac ROS debian package.
#
# Generated by scripts/gen_repack.py -- edit the generator, not this file.
#
# The binaries are NVIDIA's own, unmodified except for RUNPATH rewriting, which is
# required to make them relocatable inside a conda prefix (see relink.py).

context:
  version: "4.5.0"

package:
  name: ros-jazzy-gxf-isaac-flatscan-localization
  version: ${{ version }}

source:
  # ros-jazzy-gxf-isaac-flatscan-localization
  - url: https://isaac.download.nvidia.com/isaac-ros/release-4/pool/main/r/ros-jazzy-gxf-isaac-flatscan-localization/ros-jazzy-gxf-isaac-flatscan-localization_4.5.0-0noble.20260706194740637_amd64.deb
    file_name: pkg0.deb
    sha256: 0ffa369bde2d971c6625797b316a2855bdc2cdf9b5bdd1fba3bc9a739a482387

build:
  number: 0
  script: build.sh
  dynamic_linking:
    # NVIDIA's binaries are relinked by relink.py, not by rattler-build.
    binary_relocation: false
    missing_dso_allowlist:
      - libcuda.so.*
      - libnvidia-*.so.*
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*
      - libcvcuda.so.*
      - libnvcv_types.so.*
      - libopencv_*.so.406*

requirements:
  build:
    - libarchive          # bsdtar, reads .deb directly
    - patchelf
    - python
  run:
    # Built on Ubuntu 24.04, so the binaries reference GLIBC_2.38 symbols. This is
    # a hard requirement on the host glibc, hence a run dep rather than a
    # run_constraints entry.
    - __glibc >=2.38
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-gxf

tests:
  - package_contents:
      files:
        # ROS dirs use underscores, conda package names use dashes.
        - share/gxf_isaac_flatscan_localization/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS
  summary: Extension containing flatscan localization related components.
  license: LicenseRef-NVIDIA-Isaac-ROS
