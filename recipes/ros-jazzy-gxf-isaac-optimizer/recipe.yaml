schema_version: 1

# Installs NVIDIA's architecture-specific git-lfs GXF extension through its upstream
# CMake package. The release archive supplies metadata/headers; media.githubusercontent
# supplies the real LFS object instead of the 132-byte pointer in GitHub archives.
context:
  version: "4.5.0"
  tag: v4.5-0
  blob_dir: ${{ "gxf_aarch64_cuda_13_0" if target_platform == "linux-aarch64" else "gxf_x86_64_cuda_13_0" }}
  blob_sha256: ${{ "d2a94123984e13fce771aaee583bea821a181caec3888c1ea30101345c256525" if target_platform == "linux-aarch64" else "406449abc1fe16d7ab6914adbbed7270946196d028a97197660f79d516913d92" }}

package:
  name: ros-jazzy-gxf-isaac-optimizer
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros/archive/refs/tags/${{ tag }}.tar.gz
    sha256: a8814fd02843a1098d00173671f03115b3b3575aabb078be371a7f977ad1e5c2
    target_directory: src
  - url: https://media.githubusercontent.com/media/NVIDIA-ISAAC-ROS/isaac_ros_nitros/${{ tag }}/isaac_ros_gxf_extensions/gxf_isaac_optimizer/lib/${{ blob_dir }}/libgxf_isaac_optimizer.so
    file_name: libgxf_isaac_optimizer.so
    sha256: ${{ blob_sha256 }}

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - blob_dir="$(case "${target_platform:-$(uname -m)}" in linux-aarch64|aarch64) echo gxf_aarch64_cuda_13_0;; *) echo gxf_x86_64_cuda_13_0;; esac)"
    - cd src/isaac_ros_gxf_extensions/gxf_isaac_optimizer
    - cp "${SRC_DIR}/libgxf_isaac_optimizer.so" "lib/${blob_dir}/libgxf_isaac_optimizer.so"
    # Upstream puts $<INSTALL_PREFIX> directly on the in-tree interface target;
    # CMake permits it only inside INSTALL_INTERFACE while generating exports.
    - sed -i 's|"$<INSTALL_PREFIX>/share/${PROJECT_NAME}/gxf/lib/lib${PROJECT_NAME}.so"|"$<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/${GXF_EXT_LIB_PATH}/lib${PROJECT_NAME}.so>;$<INSTALL_INTERFACE:$<INSTALL_PREFIX>/share/${PROJECT_NAME}/gxf/lib/lib${PROJECT_NAME}.so>"|' CMakeLists.txt
    - sed -i 's|"$<INSTALL_PREFIX>/share/${PROJECT_NAME}/gxf/include"|"$<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/gxf>;$<INSTALL_INTERFACE:$<INSTALL_PREFIX>/share/${PROJECT_NAME}/gxf/include>"|' CMakeLists.txt
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="${CUDA_ARCHITECTURES:-$(case "${target_platform:-$(uname -m)}" in linux-aarch64|aarch64) echo "87;110;120";; *) echo "80;86;89;90";; esac)}"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
    - python "${RECIPE_DIR}/relink.py" "${PREFIX}" "share/gxf_isaac_optimizer"
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - libcuda.so.*
      - libnvidia-*.so.*
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - patchelf
    - python
  host:
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-gxf
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - python
    - pyyaml
  run:
    - __glibc >=2.38
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-gxf

tests:
  - package_contents:
      files:
        - share/gxf_isaac_optimizer/package.xml
        - share/gxf_isaac_optimizer/gxf/lib/libgxf_isaac_optimizer.so

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros
  summary: 'GXF extension containing environment management components, such as pose tree, map providers, and the composite schema server.'
  license: Apache-2.0
  license_file: src/LICENSE
