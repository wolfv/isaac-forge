schema_version: 1

# Installs NVIDIA's architecture-specific git-lfs GXF extension through its upstream
# CMake package. The release archive supplies metadata/headers; media.githubusercontent
# supplies the real LFS object instead of the 132-byte pointer in GitHub archives.
context:
  version: "4.5.0"
  tag: v4.5-0
  blob_dir: ${{ "gxf_aarch64_cuda_13_0" if target_platform == "linux-aarch64" else "gxf_x86_64_cuda_13_0" }}
  blob_sha256: ${{ "015f287b872ea93cfd67368abba765babde3699171eb3ceaf59f48abf4659869" if target_platform == "linux-aarch64" else "ee00251eed1e0e6e36c1cff45d0199648c10427df86228a883d6675437001aef" }}

package:
  name: ros-jazzy-gxf-isaac-range-scan-processing
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros/archive/refs/tags/${{ tag }}.tar.gz
    sha256: a8814fd02843a1098d00173671f03115b3b3575aabb078be371a7f977ad1e5c2
    target_directory: src
  - url: https://media.githubusercontent.com/media/NVIDIA-ISAAC-ROS/isaac_ros_nitros/${{ tag }}/isaac_ros_gxf_extensions/gxf_isaac_range_scan_processing/lib/${{ blob_dir }}/libgxf_isaac_range_scan_processing.so
    file_name: libgxf_isaac_range_scan_processing.so
    sha256: ${{ blob_sha256 }}

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - blob_dir="$(case "${target_platform:-$(uname -m)}" in linux-aarch64|aarch64) echo gxf_aarch64_cuda_13_0;; *) echo gxf_x86_64_cuda_13_0;; esac)"
    - cd src/isaac_ros_gxf_extensions/gxf_isaac_range_scan_processing
    - cp "${SRC_DIR}/libgxf_isaac_range_scan_processing.so" "lib/${blob_dir}/libgxf_isaac_range_scan_processing.so"
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="${CUDA_ARCHITECTURES:-$(case "${target_platform:-$(uname -m)}" in linux-aarch64|aarch64) echo "87;110;120";; *) echo "80;86;89;90";; esac)}"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
    - python "${RECIPE_DIR}/relink.py" "${PREFIX}"
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - libcuda.so.*
      - libnvidia-*.so.*
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - patchelf
    - python
  host:
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-gxf
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - python
    - pyyaml
  run:
    - __glibc >=2.38
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-gxf

tests:
  - package_contents:
      files:
        - share/gxf_isaac_range_scan_processing/package.xml
        - share/gxf_isaac_range_scan_processing/gxf/lib/libgxf_isaac_range_scan_processing.so

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros
  summary: 'GXF extension containing components for processing range scan data.'
  license: Apache-2.0
  license_file: src/LICENSE
