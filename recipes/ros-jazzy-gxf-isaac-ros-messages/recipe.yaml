schema_version: 1

# Repacked from the official Isaac ROS debian package.
#
# Generated by scripts/gen_repack.py -- edit the generator, not this file.
#
# The binaries are NVIDIA's own, unmodified except for RUNPATH rewriting, which is
# required to make them relocatable inside a conda prefix (see relink.py).

context:
  version: "4.5.0"

package:
  name: ros-jazzy-gxf-isaac-ros-messages
  version: ${{ version }}

source:
  # ros-jazzy-gxf-isaac-ros-messages
  - url: https://isaac.download.nvidia.com/isaac-ros/release-4/pool/main/r/ros-jazzy-gxf-isaac-ros-messages/ros-jazzy-gxf-isaac-ros-messages_4.5.0-0noble.20260706164450789_amd64.deb
    file_name: pkg0.deb
    sha256: 6659693a24e7675aa3ab2e988eae0997b1043e2f357ecf2dcac731c1ae7c2e9d

build:
  # The checked-in vendor payload is amd64. Do not mislabel it as an ARM package.
  # Replace this with the corresponding ARM blob/source before enabling on Jetson.
  skip: target_platform == "linux-aarch64"
  number: 0
  script: build.sh
  dynamic_linking:
    # NVIDIA's binaries are relinked by relink.py, not by rattler-build.
    binary_relocation: false
    missing_dso_allowlist:
      - libcuda.so.*
      - libnvidia-*.so.*
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*
      - libcvcuda.so.*
      - libnvcv_types.so.*
      - libopencv_*.so.406*

requirements:
  build:
    - libarchive          # bsdtar, reads .deb directly
    - patchelf
    - python
  run:
    # Built on Ubuntu 24.04, so the binaries reference GLIBC_2.38 symbols. This is
    # a hard requirement on the host glibc, hence a run dep rather than a
    # run_constraints entry.
    - __glibc >=2.38
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-gxf

tests:
  - package_contents:
      files:
        # ROS dirs use underscores, conda package names use dashes.
        - share/gxf_isaac_ros_messages/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS
  summary: Extension containing Isaac ROS related messages and data types.
  license: LicenseRef-NVIDIA-Isaac-ROS
