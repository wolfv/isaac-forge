schema_version: 1

# Installs NVIDIA's architecture-specific git-lfs GXF extension through its upstream
# CMake package. The release archive supplies metadata/headers; media.githubusercontent
# supplies the real LFS object instead of the 132-byte pointer in GitHub archives.
context:
  version: "4.5.0"
  tag: v4.5-0
  blob_dir: ${{ "gxf_aarch64_cuda_13_0" if target_platform == "linux-aarch64" else "gxf_x86_64_cuda_13_0" }}
  blob_sha256: ${{ "4ccb8e53bae49b191aaa857527a82ded74b95a6cf1cceb665e3a03aa9e3070b9" if target_platform == "linux-aarch64" else "f9fbbd6ed86f7adfcf209b0c5c81e3ac9fdec6895e2992cf02f5e787c33003ac" }}

package:
  name: ros-jazzy-gxf-isaac-utils
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros/archive/refs/tags/${{ tag }}.tar.gz
    sha256: a8814fd02843a1098d00173671f03115b3b3575aabb078be371a7f977ad1e5c2
    target_directory: src
  - url: https://media.githubusercontent.com/media/NVIDIA-ISAAC-ROS/isaac_ros_nitros/${{ tag }}/isaac_ros_gxf_extensions/gxf_isaac_utils/lib/${{ blob_dir }}/libgxf_utils.so
    file_name: libgxf_utils.so
    sha256: ${{ blob_sha256 }}

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - cd src/isaac_ros_gxf_extensions/gxf_isaac_utils
    - grep -qE 'find_package\(Eigen3 [0-9]' CMakeLists.txt
    - sed -i -E 's|find_package\(Eigen3 [0-9.]+|find_package(Eigen3|' CMakeLists.txt
    - cp "${SRC_DIR}/libgxf_utils.so" "lib/${blob_dir}/libgxf_utils.so"
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="${CUDA_ARCHITECTURES:-$(case "${target_platform:-$(uname -m)}" in linux-aarch64|aarch64) echo "87;110;120";; *) echo "80;86;89;90";; esac)}"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
    - python "${RECIPE_DIR}/relink.py" "${PREFIX}" "share/gxf_isaac_utils"
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - libcuda.so.*
      - libnvidia-*.so.*
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - patchelf
    - python
  host:
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-gxf-isaac-gems
    - ros-jazzy-gxf-isaac-messages
    - ros-jazzy-isaac-ros-gxf
    - yaml-cpp
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - eigen 3.4.*
    - yaml-cpp
    - python
    - pyyaml
  run:
    - __glibc >=2.38
    - ros-jazzy-gxf-isaac-messages
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-gxf
    - yaml-cpp

tests:
  - package_contents:
      files:
        - share/gxf_isaac_utils/package.xml
        - share/gxf_isaac_utils/gxf/lib/libgxf_utils.so

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros
  summary: 'NvIsaacUtilsExtension'
  license: Apache-2.0
  license_file: src/LICENSE
