schema_version: 1

# ros-jazzy-isaac-common-py, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_common/isaac_common_py
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-common-py
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_common/archive/refs/tags/v4.5-0.tar.gz
    sha256: b7a2bb09bad33c3654750a412c2c902064e8256088e1b1391ecd1dbcd803d0f7
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_common_py
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - pyyaml
    - ros-jazzy-ament-index-python
    - ros-jazzy-isaac-ros-common
  run:
    - python
    - ros-jazzy-isaac-ros-common

tests:
  - package_contents:
      files:
        - share/isaac_common_py/package.xml
        - share/ament_index/resource_index/packages/isaac_common_py
  - python:
      imports:
        - isaac_common_py
      pip_check: false

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_common
  summary: "ROS-free python utilities"
  license: Apache-2.0
