schema_version: 1

# ros-jazzy-isaac-common, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_common/isaac_common
# Detected build traits: ament_auto, python.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-common
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_common/archive/refs/tags/v4.5-0.tar.gz
    sha256: b7a2bb09bad33c3654750a412c2c902064e8256088e1b1391ecd1dbcd803d0f7
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - cd src/isaac_common
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-isaac-ros-common
    - python
    - pyyaml
  run:
    - __glibc >=2.38
    - ros-jazzy-isaac-ros-common

tests:
  - package_contents:
      files:
        - share/isaac_common/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_common
  summary: Common utilities for Isaac that are not depending on ROS.
  license: LicenseRef-NVIDIA-Isaac-ROS
