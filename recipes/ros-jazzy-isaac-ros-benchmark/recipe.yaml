schema_version: 1

# ros-jazzy-isaac-ros-benchmark, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_benchmark/isaac_ros_benchmark
# Detected build traits: ament_auto, cuda, magicenum, python.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-ros-benchmark
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_benchmark/archive/refs/tags/v4.5-0.tar.gz
    sha256: 3f37f7d22571a43f58b9a701940e8ee12c001f753fd5637be1e6d78a4bee1721
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - export CXXFLAGS="${CXXFLAGS:-} -I${PREFIX}/include/magic_enum"
    - cd src/isaac_ros_benchmark
    # ${CMAKE_ARGS} carries the compiler activation's CMAKE_FIND_ROOT_PATH, which is
    # what points find_package(CUDAToolkit) at the prefix rather than /usr/local/cuda.
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-ament-cmake-python
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-gxf
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-isaac-ros-nitros-camera-info-type
    - ros-jazzy-isaac-ros-nitros-compressed-image-type
    - ros-jazzy-isaac-ros-nitros-detection2-d-array-type
    - ros-jazzy-isaac-ros-nitros-detection3-d-array-type
    - ros-jazzy-isaac-ros-nitros-disparity-image-type
    - ros-jazzy-isaac-ros-nitros-flat-scan-type
    - ros-jazzy-isaac-ros-nitros-image-type
    - ros-jazzy-isaac-ros-nitros-imu-type
    - ros-jazzy-isaac-ros-nitros-occupancy-grid-type
    - ros-jazzy-isaac-ros-nitros-point-cloud-type
    - ros-jazzy-isaac-ros-nitros-pose-cov-stamped-type
    - ros-jazzy-isaac-ros-nitros-std-msg-type
    - ros-jazzy-isaac-ros-nitros-tensor-list-type
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-components
    - ros-jazzy-rclpy
    - ros-jazzy-ros2-benchmark
    - ros-jazzy-sensor-msgs
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - magic_enum
    - python
    - pyyaml
  run:
    - __glibc >=2.38
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-gxf
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-isaac-ros-nitros-camera-info-type
    - ros-jazzy-isaac-ros-nitros-compressed-image-type
    - ros-jazzy-isaac-ros-nitros-detection2-d-array-type
    - ros-jazzy-isaac-ros-nitros-detection3-d-array-type
    - ros-jazzy-isaac-ros-nitros-disparity-image-type
    - ros-jazzy-isaac-ros-nitros-flat-scan-type
    - ros-jazzy-isaac-ros-nitros-image-type
    - ros-jazzy-isaac-ros-nitros-imu-type
    - ros-jazzy-isaac-ros-nitros-occupancy-grid-type
    - ros-jazzy-isaac-ros-nitros-point-cloud-type
    - ros-jazzy-isaac-ros-nitros-pose-cov-stamped-type
    - ros-jazzy-isaac-ros-nitros-std-msg-type
    - ros-jazzy-isaac-ros-nitros-tensor-list-type
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-components
    - ros-jazzy-rclpy
    - ros-jazzy-ros2-benchmark
    - ros-jazzy-sensor-msgs

tests:
  - package_contents:
      files:
        - share/isaac_ros_benchmark/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_benchmark
  summary: "Isaac ROS benchmarking utilities"
  license: Apache-2.0
