schema_version: 1

# ros-jazzy-isaac-ros-centerpose, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_pose_estimation/isaac_ros_centerpose
# Detected build traits: ament_auto, cuda, magicenum, opencv, python.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-ros-centerpose
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_pose_estimation/archive/refs/tags/v4.5-0.tar.gz
    sha256: 7e6855053fbc1e9af5683c36e6e5642e2d5db9de8783753371ddeb4c565aee13
    target_directory: src
    patches:
      - patches/0001-tensor-rt-and-triton-are-runtime-dependencies.patch
build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - export CXXFLAGS="${CXXFLAGS:-} -I${PREFIX}/include/magic_enum"
    - cd src/isaac_ros_centerpose
    # ${CMAKE_ARGS} carries the compiler activation's CMAKE_FIND_ROOT_PATH, which is
    # what points find_package(CUDAToolkit) at the prefix rather than /usr/local/cuda.
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - eigen
    - libopencv 4.13.*
    - ros-jazzy-ament-cmake
    - ros-jazzy-cv-bridge
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-dnn-image-encoder
    - ros-jazzy-isaac-ros-gxf
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-isaac-ros-nitros-camera-info-type
    - ros-jazzy-isaac-ros-nitros-detection3-d-array-type
    - ros-jazzy-isaac-ros-nitros-image-type
    - ros-jazzy-isaac-ros-nitros-tensor-list-type
    - ros-jazzy-isaac-ros-tensor-list-interfaces
    - ros-jazzy-message-filters
    - ros-jazzy-rclcpp
    - ros-jazzy-sensor-msgs
    - ros-jazzy-tf2-eigen
    - ros-jazzy-ament-cmake-auto
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - magic_enum
    - python
    - pyyaml
  run:
    - __glibc >=2.38
    - libopencv 4.13.*
    - ros-jazzy-cv-bridge
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-dnn-image-encoder
    - ros-jazzy-isaac-ros-gxf
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-isaac-ros-nitros-camera-info-type
    - ros-jazzy-isaac-ros-nitros-detection3-d-array-type
    - ros-jazzy-isaac-ros-nitros-image-type
    - ros-jazzy-isaac-ros-nitros-tensor-list-type
    - ros-jazzy-isaac-ros-tensor-list-interfaces
    - ros-jazzy-message-filters
    - ros-jazzy-rclcpp
    - ros-jazzy-sensor-msgs
    - ros-jazzy-tf2-eigen

tests:
  - package_contents:
      files:
        - share/isaac_ros_centerpose/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_pose_estimation
  summary: "CenterPose: Pose Estimation using Deep Learning"
  license: Apache-2.0
