schema_version: 1

# ros-jazzy-isaac-ros-cumotion-examples, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_cumotion/isaac_ros_cumotion_examples
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "4.6.0"

package:
  name: ros-jazzy-isaac-ros-cumotion-examples
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cumotion/archive/refs/tags/v4.6-0.tar.gz
    sha256: c8d0476a8d74e3d9567a70c9d6565d266133a3a6b4e6d52c457a668dff4c292e
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_cumotion_examples
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-cumotion
    - ros-jazzy-isaac-ros-cumotion-moveit
    - ros-jazzy-isaac-ros-cumotion-robot-description
    - ros-jazzy-moveit-resources-panda-description
    - ros-jazzy-moveit-resources-panda-moveit-config
    - ros-jazzy-moveit2-tutorials
    - ros-jazzy-rclcpp-components
    - ros-jazzy-ros2launch
    - ros-jazzy-rviz2
    - ros-jazzy-ur-moveit-config
    - ros-jazzy-ur-robot-driver

tests:
  - package_contents:
      files:
        - share/isaac_ros_cumotion_examples/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_cumotion_examples

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cumotion
  summary: "Examples demonstrating Isaac ROS cuMotion with MoveIt"
  license: Apache-2.0
