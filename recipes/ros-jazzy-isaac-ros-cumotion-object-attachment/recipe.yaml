schema_version: 1

# ros-jazzy-isaac-ros-cumotion-object-attachment, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_cumotion/isaac_ros_cumotion_object_attachment
# Detected build traits: ament_auto, cuda, magicenum, python.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-ros-cumotion-object-attachment
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cumotion/archive/refs/tags/v4.5-0.tar.gz
    sha256: 3ef770f800665ad25569291f935ef8c47f752a301575aaca1c26df5199c2b520
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - export CXXFLAGS="${CXXFLAGS:-} -I${PREFIX}/include/magic_enum"
    - export CUDAFLAGS="${CUDAFLAGS:-} -I${PREFIX}/include/magic_enum"
    - cd src/isaac_ros_cumotion_object_attachment
    # ${CMAKE_ARGS} carries the compiler activation's CMAKE_FIND_ROOT_PATH, which is
    # what points find_package(CUDAToolkit) at the prefix rather than /usr/local/cuda.
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - assimp
    - eigen
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-geometry-msgs
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-cumotion-interfaces
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-nvblox-msgs
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-action
    - ros-jazzy-rclcpp-components
    - ros-jazzy-sensor-msgs
    - ros-jazzy-tf2
    - ros-jazzy-tf2-geometry-msgs
    - ros-jazzy-tf2-ros
    - ros-jazzy-visualization-msgs
    - yaml-cpp
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - magic_enum
    - python
    - pyyaml
  run:
    - __glibc >=2.38
    - assimp
    - ros-jazzy-geometry-msgs
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-cumotion-interfaces
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-nvblox-msgs
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-action
    - ros-jazzy-rclcpp-components
    - ros-jazzy-sensor-msgs
    - ros-jazzy-tf2
    - ros-jazzy-tf2-geometry-msgs
    - ros-jazzy-tf2-ros
    - ros-jazzy-visualization-msgs
    - yaml-cpp

tests:
  - package_contents:
      files:
        - share/isaac_ros_cumotion_object_attachment/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cumotion
  summary: "Package attaches/detaches a grasped object to robot's collision geometry"
  license: Apache-2.0
