schema_version: 1

# ros-jazzy-isaac-ros-dnn-image-encoder, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_dnn_inference/isaac_ros_dnn_image_encoder
# Detected build traits: ament_auto, cuda, cvcuda, magicenum, python.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-ros-dnn-image-encoder
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_dnn_inference/archive/refs/tags/v4.5-0.tar.gz
    sha256: e19397a4f685fffc66cd68d1a8489fc2939878ea6299c376d04ab5d19c09ce06
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - export CXXFLAGS="${CXXFLAGS:-} -I${PREFIX}/include/magic_enum"
    - cd src/isaac_ros_dnn_image_encoder
    # ${CMAKE_ARGS} carries the compiler activation's CMAKE_FIND_ROOT_PATH, which is
    # what points find_package(CUDAToolkit) at the prefix rather than /usr/local/cuda.
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-ament-index-cpp
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-gxf
    - ros-jazzy-isaac-ros-image-proc
    - ros-jazzy-isaac-ros-managed-nitros
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-isaac-ros-nitros-image-type
    - ros-jazzy-isaac-ros-nitros-tensor-list-type
    - ros-jazzy-isaac-ros-tensor-proc
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-components
    - ros-jazzy-ament-cmake-auto
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - libcvcuda >=0.16
    - libcvcuda-dev >=0.16
    - magic_enum
    - python
    - pyyaml
  run:
    - __glibc >=2.38
    - ros-jazzy-ament-index-cpp
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-gxf
    - ros-jazzy-isaac-ros-image-proc
    - ros-jazzy-isaac-ros-managed-nitros
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-isaac-ros-nitros-image-type
    - ros-jazzy-isaac-ros-nitros-tensor-list-type
    - ros-jazzy-isaac-ros-tensor-proc
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-components

tests:
  - package_contents:
      files:
        - share/isaac_ros_dnn_image_encoder/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_dnn_inference
  summary: "Encoder for preprocessing images into tensors for deep learning inference"
  license: Apache-2.0
