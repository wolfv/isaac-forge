schema_version: 1

# ros-jazzy-isaac-ros-examples, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_examples/isaac_ros_examples
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-ros-examples
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_examples/archive/refs/tags/v4.5-0.tar.gz
    sha256: f6a14b7f3560a6d985d42dd53cdd8d40c11aa9a994fc8f65b168c505add7478e
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_examples
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-launch
    - ros-jazzy-launch-ros

tests:
  - package_contents:
      files:
        - share/isaac_ros_examples/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_examples
  - python:
      imports:
        - isaac_ros_examples
      pip_check: false

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_examples
  summary: "Utilities for launching example graphs of Isaac ROS packages"
  license: Apache-2.0
