build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - blob_dir="$(case "${target_platform:-$(uname -m)}" in linux-aarch64|aarch64) echo gxf_aarch64_cuda_13_0;; *) echo gxf_x86_64_cuda_13_0;; esac)"
    - cd src/isaac_ros_gxf
    - mkdir -p "gxf/core/lib/${blob_dir}"
    - cp -a "${SRC_DIR}/blobs/." "gxf/core/lib/${blob_dir}/"
    # Upstream shells out to uname, which defeats conda's target toolchain during
    # cross-build audits. CMAKE_SYSTEM_PROCESSOR is aarch64 both cross and native.
    - sed -i 's|execute_process(COMMAND uname -m COMMAND tr -d '\''\\n'\'' OUTPUT_VARIABLE ARCHITECTURE)|set(ARCHITECTURE "${CMAKE_SYSTEM_PROCESSOR}")|' CMakeLists.txt
    # Like the extension packages, GXF core puts INSTALL_PREFIX directly on in-tree
    # interface targets. Keep those paths install-only so CMake can generate exports.
    - sed -i -E 's|"\$<INSTALL_PREFIX>([^"]+)"|"$<INSTALL_INTERFACE:$<INSTALL_PREFIX>\1>"|g' CMakeLists.txt
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
    - python "${RECIPE_DIR}/relink.py" "${PREFIX}" "share/isaac_ros_gxf" "lib/libgxf_core.so" "lib/libgxf_logger.so" "lib/libgxf_multimedia.so" "lib/libgxf_cuda.so"
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - libcuda.so.*
      - libnvidia-*.so.*
      - libgxf_*.so
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # isaac_ros_common's exported extras unconditionally call FindCUDAToolkit.
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - patchelf
    # CMake runs isaac_ros_version_embed.py with build-prefix Python.
    - python
    - pyyaml
  host:
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-isaac-ros-common
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - magic_enum
    - ucx
    - python
  run:
    - __glibc >=2.38
    - ros-jazzy-isaac-ros-common
    - magic_enum
    - ucx

tests:
  - package_contents:
      lib:
        - gxf_core
        - gxf_logger
        - gxf_multimedia
        - gxf_cuda
      files:
        - share/isaac_ros_gxf/package.xml
        - share/isaac_ros_gxf/gxf/lib/std/libgxf_std.so

