schema_version: 1

# ros-jazzy-isaac-ros-image-pipeline, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_image_pipeline/isaac_ros_image_pipeline
# Detected build traits: cuda.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-ros-image-pipeline
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_image_pipeline/archive/refs/tags/v4.5-0.tar.gz
    sha256: 66a0ea87a075c4eb428faa4b987768928ae0250e6ab801db4bcbeef8fa8924b1
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - cd src/isaac_ros_image_pipeline
    # ${CMAKE_ARGS} carries the compiler activation's CMAKE_FIND_ROOT_PATH, which is
    # what points find_package(CUDAToolkit) at the prefix rather than /usr/local/cuda.
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-ament-cmake
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-depth-image-proc
    - ros-jazzy-isaac-ros-image-proc
    - ros-jazzy-isaac-ros-stereo-image-proc
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
  run:
    - __glibc >=2.38
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-depth-image-proc
    - ros-jazzy-isaac-ros-image-proc
    - ros-jazzy-isaac-ros-stereo-image-proc

tests:
  - package_contents:
      files:
        - share/isaac_ros_image_pipeline/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_image_pipeline
  summary: "Core image processing"
  license: Apache-2.0
