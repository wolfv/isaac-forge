schema_version: 1

# ros-jazzy-isaac-ros-image-proc-benchmark, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_benchmark/benchmarks/isaac_ros_image_proc_benchmark
# Detected build traits: ament_auto, python.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-ros-image-proc-benchmark
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_benchmark/archive/refs/tags/v4.5-0.tar.gz
    sha256: 3f37f7d22571a43f58b9a701940e8ee12c001f753fd5637be1e6d78a4bee1721
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - cd src/benchmarks/isaac_ros_image_proc_benchmark
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-isaac-ros-benchmark
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-image-proc
    - ros-jazzy-rclpy
    - python
    - pyyaml
  run:
    - __glibc >=2.38
    - ros-jazzy-isaac-ros-benchmark
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-image-proc
    - ros-jazzy-rclpy

tests:
  - package_contents:
      files:
        - share/isaac_ros_image_proc_benchmark/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_benchmark
  summary: Scripts for benchmarking Isaac ROS image proc graphs
  license: LicenseRef-NVIDIA-Isaac-ROS
