schema_version: 1

# ros-jazzy-isaac-ros-json-info-generator, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_cloud_control/isaac_ros_json_info_generator
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "5.0.0"

package:
  name: ros-jazzy-isaac-ros-json-info-generator
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cloud_control/archive/refs/tags/v5.0-0.tar.gz
    sha256: f45fe5425833424a5ee7b3a8ec027d17c397d9ee339ce43ba7fc58e48aa59176
    target_directory: src

build:
  number: 1
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_json_info_generator
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
    - mkdir -p "${PREFIX}/lib/isaac_ros_json_info_generator"
    - ln -sf "../../bin/json_info_generator_node" "${PREFIX}/lib/isaac_ros_json_info_generator/json_info_generator_node"

requirements:
  host:
    - python
    - pip
    - setuptools
    - pyyaml
    - ros-jazzy-ament-index-python
    - ros-jazzy-isaac-ros-common
  run:
    - python
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-rclpy
    - ros-jazzy-rosbridge-library
    - ros-jazzy-std-msgs

tests:
  - package_contents:
      files:
        - share/isaac_ros_json_info_generator/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_json_info_generator
        - lib/isaac_ros_json_info_generator/json_info_generator_node
  - python:
      imports:
        - isaac_ros_json_info_generator
      pip_check: false

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cloud_control
  summary: "JSON Info Generator"
  license: Apache-2.0
