schema_version: 1

# ros-jazzy-isaac-ros-manipulation-servers, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_manipulation/isaac_ros_manipulation_servers
# Detected build traits: ament_auto, cuda, python.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-ros-manipulation-servers
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_manipulation/archive/refs/tags/v4.5-0.tar.gz
    sha256: 00d45ee0c52efe40688d90958538092c713ad1eec0fe62befcdfe74a1c33225f
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - cd src/isaac_ros_manipulation_servers
    # ${CMAKE_ARGS} carries the compiler activation's CMAKE_FIND_ROOT_PATH, which is
    # what points find_package(CUDAToolkit) at the prefix rather than /usr/local/cuda.
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-manipulation-interfaces
    - ros-jazzy-isaac-ros-manipulation-ros-python-utils
    - ros-jazzy-isaac-ros-segment-anything2-interfaces
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-action
    - ros-jazzy-rclcpp-components
    - ros-jazzy-sensor-msgs
    - ros-jazzy-vision-msgs
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - python
    - pyyaml
  run:
    - __glibc >=2.38
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-manipulation-interfaces
    - ros-jazzy-isaac-ros-manipulation-ros-python-utils
    - ros-jazzy-isaac-ros-segment-anything2-interfaces
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-action
    - ros-jazzy-rclcpp-components
    - ros-jazzy-sensor-msgs
    - ros-jazzy-vision-msgs

tests:
  - package_contents:
      files:
        - share/isaac_ros_manipulation_servers/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_manipulation
  summary: "Action servers for Isaac ROS Manipulation Servers"
  license: Apache-2.0
