schema_version: 1

# ros-jazzy-isaac-ros-nitros-detection2-d-array-type, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_nitros/isaac_ros_nitros_type/isaac_ros_nitros_detection2_d_array_type
# Detected build traits: ament_auto, cuda, magicenum, python, yamlcpp.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-ros-nitros-detection2-d-array-type
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros/archive/refs/tags/v4.5-0.tar.gz
    sha256: a8814fd02843a1098d00173671f03115b3b3575aabb078be371a7f977ad1e5c2
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - export CXXFLAGS="${CXXFLAGS:-} -I${PREFIX}/include/magic_enum"
    - export CUDAFLAGS="${CUDAFLAGS:-} -I${PREFIX}/include/magic_enum"
    - cd src/isaac_ros_nitros_type/isaac_ros_nitros_detection2_d_array_type
    # ${CMAKE_ARGS} carries the compiler activation's CMAKE_FIND_ROOT_PATH, which is
    # what points find_package(CUDAToolkit) at the prefix rather than /usr/local/cuda.
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-ament-cmake
    - ros-jazzy-ament-index-cpp
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-negotiated
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-components
    - ros-jazzy-vision-msgs
    - ros-jazzy-ament-cmake-auto
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - magic_enum
    - python
    - pyyaml
    - yaml-cpp
  run:
    - __glibc >=2.38
    - ros-jazzy-ament-index-cpp
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-negotiated
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-components
    - ros-jazzy-vision-msgs

tests:
  - package_contents:
      files:
        - share/isaac_ros_nitros_detection2_d_array_type/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros
  summary: "Isaac ROS Nitros Detection 2D Array Type"
  license: LicenseRef-NVIDIA-Isaac-ROS
