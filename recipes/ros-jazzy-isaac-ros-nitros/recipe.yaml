schema_version: 1

# isaac_ros_nitros: library compiled FROM SOURCE, vendored blobs taken from the deb.
#
# NITROS is the foundation of the whole stack, so getting libisaac_ros_nitros.so off a
# repack is the single biggest win available. But it cannot be a pure source build,
# for a reason worth spelling out:
#
# CMakeLists.txt registers three ament resources pointing at prebuilt SDKs vendored
# into the repo --
#
#   ament_index_register_resource(cuvslam     CONTENT share/isaac_ros_nitros/cuvslam)
#   ament_index_register_resource(cuapriltags CONTENT share/isaac_ros_nitros/cuapriltags)
#   ament_index_register_resource(cumotion    CONTENT share/isaac_ros_nitros/cumotion)
#
# -- and those are git-lfs objects. A GitHub release tarball contains LFS *pointers*,
# not content: libcuvslam.so arrives as 132 bytes of text reading
#
#   version https://git-lfs.github.com/spec/v1
#   oid sha256:d870759dc6d78b9fe55dbb842cac3b6cd6d804bde04dd8b546b5f2c466834f5e
#   size 876726
#
# Installing that would leave text files where libraries belong and break cuVSLAM,
# cuAprilTags and cuMotion in a way that only shows up at runtime.
#
# So: compile the library from the tarball, then overlay the three blob directories
# from the official deb. Nothing is lost by doing so -- cuVSLAM and cuMotion have no
# published source at all, they are part of the irreducible binary floor either way.
# What we gain is that libisaac_ros_nitros.so itself is built against RoboStack rather
# than dropped in from Ubuntu.
#
# Licensed under the NVIDIA Isaac ROS Software License: source may be compiled but not
# modified, so this recipe carries no patches.

context:
  version: "4.5.0"
  tag: v4.5-0
  cuvslam_dir: ${{ "lib_aarch64_jetpack70" if target_platform == "linux-aarch64" else "lib_x86_64_cuda_13_0" }}
  cuapriltags_dir: ${{ "lib_aarch64_jetpack61" if target_platform == "linux-aarch64" else "lib_x86_64_cuda_12_6" }}
  cumotion_dir: ${{ "aarch64_jetpack70" if target_platform == "linux-aarch64" else "x86_64_cuda_13_0" }}

package:
  name: ros-jazzy-isaac-ros-nitros
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros/archive/refs/tags/${{ tag }}.tar.gz
    sha256: a8814fd02843a1098d00173671f03115b3b3575aabb078be371a7f977ad1e5c2
    target_directory: src
  # Resolve only the four git-lfs objects CMake installs. Each URL returns the real
  # object rather than GitHub's pointer, and each architecture has its own pinned hash.
  - url: https://media.githubusercontent.com/media/NVIDIA-ISAAC-ROS/isaac_ros_nitros/${{ tag }}/isaac_ros_nitros/lib/cuvslam/${{ cuvslam_dir }}/libcuvslam.so
    file_name: libcuvslam.so
    target_directory: blobs/cuvslam
    sha256: ${{ "0f3c18f0da00ba9a5f3ad833c560b7132f8f71a9dfcff01f134ce5b7a6f83d02" if target_platform == "linux-aarch64" else "d870759dc6d78b9fe55dbb842cac3b6cd6d804bde04dd8b546b5f2c466834f5e" }}
  - url: https://media.githubusercontent.com/media/NVIDIA-ISAAC-ROS/isaac_ros_nitros/${{ tag }}/isaac_ros_nitros/lib/cuvslam/${{ cuvslam_dir }}/cuvslam_api_launcher
    file_name: cuvslam_api_launcher
    target_directory: blobs/cuvslam
    sha256: ${{ "c8b7bcb74c3da5adc69fdadf511b1096ccb1828e5fc5c78e308f977be837a630" if target_platform == "linux-aarch64" else "809717836ad7281cf5682f17c813c6418cc944a638072d43baad0f50d8bd7ecb" }}
  - url: https://media.githubusercontent.com/media/NVIDIA-ISAAC-ROS/isaac_ros_nitros/${{ tag }}/isaac_ros_nitros/lib/cuapriltags/${{ cuapriltags_dir }}/libcuapriltags.a
    file_name: libcuapriltags.a
    target_directory: blobs/cuapriltags
    sha256: ${{ "e67298e8ee52d6253cd702f4c55b3727bea177f57236aa23797bde50d74dfc24" if target_platform == "linux-aarch64" else "a7f32f58782de61dd23e507fe6ce5a907379498deec505669fe339ecd4facba7" }}
  - url: https://media.githubusercontent.com/media/NVIDIA-ISAAC-ROS/isaac_ros_nitros/${{ tag }}/isaac_ros_nitros/lib/cumotion/${{ cumotion_dir }}/lib/libcumotion.so.1.1.0
    file_name: libcumotion.so.1.1.0
    target_directory: blobs/cumotion
    sha256: ${{ "6977efcb757839a3d992c368d8bb9ef12c4ee728469b567ae3baa26d89717c76" if target_platform == "linux-aarch64" else "fe13f8b2c1b6d908a72f087041a2385a1b4c2157323623bdf3e905f2852c9a2c" }}

build:
  number: 0
  script: build.sh
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and friends
      # are dlopen'd or resolved via the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - python
    - pyyaml
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-ament-index-cpp
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-components
    - ros-jazzy-std-msgs
    - ros-jazzy-diagnostic-msgs
    - ros-jazzy-negotiated
    # Source-built now.
    - ros-jazzy-isaac-ros-common
    # Blob-only: GXF core and the extensions NVIDIA publishes no source for.
    - ros-jazzy-isaac-ros-gxf
    - ros-jazzy-gxf-isaac-optimizer
    - ros-jazzy-gxf-isaac-message-compositor
    - ros-jazzy-gxf-isaac-gxf-helpers
    - ros-jazzy-gxf-isaac-sight
    - ros-jazzy-gxf-isaac-atlas
    - vpi
    # NITROS does find_package(Eigen3 3.3 REQUIRED NO_MODULE); conda-forge's eigen is
    # at 5.x, whose config rejects a 3.3 request on the major-version bump.
    - eigen 3.4.*
    - yaml-cpp
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    # Compiled against directly, through isaac_ros_gxf's expected_macro.hpp, which every
    # source including a NITROS header pulls in. It also arrives transitively as a run dep of
    # ros-jazzy-isaac-ros-gxf, and relying on that is what kept ISSUES.md #17 invisible until
    # conda-forge's magic_enum 0.9.7 nested its header one directory deeper. Declare it, and
    # see build.sh for why the include directory has to be stated as well.
    - magic_enum
  run:
    - __glibc >=2.38
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-components
    - ros-jazzy-ament-index-cpp
    - ros-jazzy-negotiated
    # A <depend> in nitros' package.xml, so ament_cmake_export_dependencies-extras.cmake
    # calls find_package(diagnostic_msgs) for every consumer at configure time. Host-only
    # is not enough: isaac_ros_cumotion fails to configure without it.
    - ros-jazzy-diagnostic-msgs
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-gxf
    - ros-jazzy-gxf-isaac-optimizer
    - ros-jazzy-gxf-isaac-message-compositor
    - ros-jazzy-gxf-isaac-gxf-helpers
    - ros-jazzy-gxf-isaac-sight
    - ros-jazzy-gxf-isaac-atlas
    - vpi

tests:
  - package_contents:
      files:
        - share/isaac_ros_nitros/package.xml
      lib:
        - isaac_ros_nitros

  # The failure this recipe exists to avoid: LFS pointers installed as libraries.
  - script:
      - bash check_blobs.sh
    files:
      recipe:
        - check_blobs.sh

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros
  summary: NVIDIA Isaac Transport for ROS (NITROS), library built from source
  license: LicenseRef-NVIDIA-Isaac-ROS
  license_file: src/LICENSE
