schema_version: 1

# ros-jazzy-isaac-ros-pynitros, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_nitros/isaac_ros_pynitros
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "4.6.0"

package:
  name: ros-jazzy-isaac-ros-pynitros
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros/archive/refs/tags/v4.6-0.tar.gz
    sha256: 187335ac33304180ef98c4d6de78428c7e5c36f1776b1cc80f68069678b996a4
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_pynitros
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - posix_ipc
    - pytorch-gpu >=2.13,<2.14
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-nitros-bridge-interfaces
    - ros-jazzy-isaac-ros-tensor-list-interfaces
    - ros-jazzy-rclpy
    - ros-jazzy-std-msgs
    - cuda-python
    - ros-jazzy-message-filters
    - numpy
    - ros-jazzy-sensor-msgs

tests:
  - package_contents:
      files:
        - share/isaac_ros_pynitros/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_pynitros
  - python:
      imports:
        - isaac_ros_pynitros
      pip_check: false

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nitros
  summary: "PyNITROS"
  license: Apache-2.0
