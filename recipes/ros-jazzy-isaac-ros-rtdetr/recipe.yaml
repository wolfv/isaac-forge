schema_version: 1

# ros-jazzy-isaac-ros-rtdetr, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_object_detection/isaac_ros_rtdetr
# Detected build traits: ament_auto, cuda, magicenum, python.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-ros-rtdetr
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_object_detection/archive/refs/tags/v4.5-0.tar.gz
    sha256: 349b78dcdbd22c019f982d343c65bd690d4affcdf8aca85183b1505943962098
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - export CXXFLAGS="${CXXFLAGS:-} -I${PREFIX}/include/magic_enum"
    - cd src/isaac_ros_rtdetr
    # ${CMAKE_ARGS} carries the compiler activation's CMAKE_FIND_ROOT_PATH, which is
    # what points find_package(CUDAToolkit) at the prefix rather than /usr/local/cuda.
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-ament-index-cpp
    - ros-jazzy-cv-bridge
    - ros-jazzy-gxf-isaac-optimizer
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-dnn-image-encoder
    - ros-jazzy-isaac-ros-image-proc
    - ros-jazzy-isaac-ros-managed-nitros
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-isaac-ros-nitros-tensor-list-type
    - ros-jazzy-isaac-ros-rtdetr-models-install
    - ros-jazzy-isaac-ros-tensor-list-interfaces
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-components
    - ros-jazzy-vision-msgs
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - magic_enum
    - python
    - pyyaml
  run:
    - __glibc >=2.38
    - ros-jazzy-ament-index-cpp
    - ros-jazzy-cv-bridge
    - ros-jazzy-gxf-isaac-optimizer
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-dnn-image-encoder
    - ros-jazzy-isaac-ros-image-proc
    - ros-jazzy-isaac-ros-managed-nitros
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-isaac-ros-nitros-tensor-list-type
    - ros-jazzy-isaac-ros-rtdetr-models-install
    - ros-jazzy-isaac-ros-tensor-list-interfaces
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-components
    - ros-jazzy-vision-msgs

tests:
  - package_contents:
      files:
        - share/isaac_ros_rtdetr/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_object_detection
  summary: "RT-DETR model processing"
  license: Apache-2.0
