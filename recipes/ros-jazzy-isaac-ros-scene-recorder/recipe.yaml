schema_version: 1

# ros-jazzy-isaac-ros-scene-recorder, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_cloud_control/isaac_ros_scene_recorder
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "5.0.0"

package:
  name: ros-jazzy-isaac-ros-scene-recorder
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cloud_control/archive/refs/tags/v5.0-0.tar.gz
    sha256: f45fe5425833424a5ee7b3a8ec027d17c397d9ee339ce43ba7fc58e48aa59176
    target_directory: src

build:
  number: 1
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_scene_recorder
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
    - mkdir -p "${PREFIX}/lib/isaac_ros_scene_recorder"
    - ln -sf "../../bin/scene_recorder" "${PREFIX}/lib/isaac_ros_scene_recorder/scene_recorder"

requirements:
  host:
    - python
    - pip
    - setuptools
    - pyyaml
    - ros-jazzy-ament-index-python
    - ros-jazzy-ament-cmake-python
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-scene-recorder-interface
  run:
    - python
    - ros-jazzy-ament-cmake-python
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-scene-recorder-interface
    - ros-jazzy-isaac-ros-vda5050-client
    - ros-jazzy-rclpy
    - psutil

tests:
  - package_contents:
      files:
        - share/isaac_ros_scene_recorder/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_scene_recorder
        - lib/isaac_ros_scene_recorder/scene_recorder
  - python:
      imports:
        - isaac_ros_scene_recorder
      pip_check: false

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cloud_control
  summary: "ROS scene recorder"
  license: Apache-2.0
