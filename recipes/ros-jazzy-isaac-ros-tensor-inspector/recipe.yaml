schema_version: 1

# ros-jazzy-isaac-ros-tensor-inspector, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_data_tools/isaac_ros_tensor_inspector
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "5.0.0"

package:
  name: ros-jazzy-isaac-ros-tensor-inspector
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_data_tools/archive/refs/tags/v5.0-0.tar.gz
    sha256: f248aa65a6dbf3ca1dec74c5da908f59f2519a2e0e17a341fc2f32ca9c1da708
    target_directory: src

build:
  number: 1
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_tensor_inspector
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
    - mkdir -p "${PREFIX}/lib/isaac_ros_tensor_inspector"
    - ln -sf "../../bin/tensor_inspector" "${PREFIX}/lib/isaac_ros_tensor_inspector/tensor_inspector"

requirements:
  host:
    - python
    - pip
    - setuptools
    - pyyaml
    - ros-jazzy-ament-index-python
    - ros-jazzy-isaac-ros-common
  run:
    - python
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-tensor-msgs
    - ros-jazzy-tensor-msgs
    - numpy
    - ros-jazzy-rclpy

tests:
  - package_contents:
      files:
        - share/isaac_ros_tensor_inspector/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_tensor_inspector
        - lib/isaac_ros_tensor_inspector/tensor_inspector
  - python:
      imports:
        - isaac_ros_tensor_inspector
      pip_check: false

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_data_tools
  summary: "Tools for inspecting and verifying TensorList messages"
  license: Apache-2.0
