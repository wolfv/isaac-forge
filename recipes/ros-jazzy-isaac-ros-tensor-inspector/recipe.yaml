# Source: isaac_ros_data_tools/isaac_ros_tensor_inspector
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-ros-tensor-inspector
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_data_tools/archive/refs/tags/v4.5-0.tar.gz
    sha256: ea085cd6620b6b12c73adab98e9f7c9ce15dced81af5ddd23ddc95eda533cb34
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_tensor_inspector
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - pyyaml
    - ros-jazzy-ament-index-python
    - ros-jazzy-isaac-ros-common
  run:
    - python
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-tensor-list-interfaces
    - numpy
    - ros-jazzy-rclpy

tests:
  - package_contents:
      files:
        - share/isaac_ros_tensor_inspector/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_tensor_inspector
  - python:
      imports:
        - isaac_ros_tensor_inspector
      pip_check: false

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_data_tools
  summary: "Tools for inspecting and verifying TensorList messages"
