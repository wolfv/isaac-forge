schema_version: 1

# ros-jazzy-isaac-ros-test, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_common/isaac_ros_test
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "5.0.0"

package:
  name: ros-jazzy-isaac-ros-test
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_common/archive/refs/tags/v5.0-0.tar.gz
    sha256: 1878a57b9e9aa44c3d4b74e7f7f9b32ecdf461ce20b43ce09ede31518662ab8c
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_test
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - pyyaml
    - ros-jazzy-ament-index-python
    - ros-jazzy-isaac-ros-common
  run:
    - python
    - py-opencv
    - pytorch-gpu ==2.13.0 cuda130_generic_*_202
    - ros-jazzy-cv-bridge
    - ros-jazzy-isaac-ros-common
    - scipy
    - ros-jazzy-geometry-msgs
    - ros-jazzy-launch
    - ros-jazzy-launch-testing
    - ros-jazzy-message-filters
    - ros-jazzy-nav-msgs
    - numpy
    - psutil
    - ros-jazzy-rclpy
    - ros-jazzy-sensor-msgs
    - ros-jazzy-sensor-msgs-py
    - ros-jazzy-std-msgs
    - ros-jazzy-stereo-msgs

tests:
  - package_contents:
      files:
        - share/isaac_ros_test/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_test
  - python:
      imports:
        - isaac_ros_test
      pip_check: false

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_common
  summary: "Isaac ROS testing utilities"
  license: LicenseRef-NVIDIA-Isaac-ROS
