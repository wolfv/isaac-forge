schema_version: 1

# ros-jazzy-isaac-ros-visual-slam-interfaces, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_visual_slam/isaac_ros_visual_slam_interfaces
# Detected build traits: ament_auto, cuda, python, rosidl.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-isaac-ros-visual-slam-interfaces
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_visual_slam/archive/refs/tags/v4.5-0.tar.gz
    sha256: 8708fb6b016138483d24e785fa8549243839fe312d63786df2bba8840b5703f9
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - cd src/isaac_ros_visual_slam_interfaces
    # ${CMAKE_ARGS} carries the compiler activation's CMAKE_FIND_ROOT_PATH, which is
    # what points find_package(CUDAToolkit) at the prefix rather than /usr/local/cuda.
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-ament-cmake
    - ros-jazzy-geometry-msgs
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-rosidl-default-generators
    - ros-jazzy-rosidl-default-runtime
    - ros-jazzy-ament-cmake-auto
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - python
    - pyyaml
  run:
    - __glibc >=2.38
    - ros-jazzy-geometry-msgs
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-rosidl-default-runtime

tests:
  - package_contents:
      files:
        - share/isaac_ros_visual_slam_interfaces/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_visual_slam
  summary: "Interfaces for Isaac ROS Visual SLAM"
  license: Apache-2.0
