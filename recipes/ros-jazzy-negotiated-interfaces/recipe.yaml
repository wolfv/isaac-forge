schema_version: 1

# ros-jazzy-negotiated-interfaces, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: negotiated/negotiated_interfaces
# Detected build traits: rosidl.

context:
  version: "0.1.0"

package:
  name: ros-jazzy-negotiated-interfaces
  version: ${{ version }}

source:
  - url: https://github.com/osrf/negotiated/archive/eac198b55dcd052af5988f0f174902913c5f20e7.tar.gz
    sha256: 01aed43adef3e6ef3d9e1879d3a2910d6acdcf802e6ea2905ab4626e21d7af05
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - cd src/negotiated_interfaces
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-ament-cmake
    - ros-jazzy-rosidl-default-generators
    - ros-jazzy-rosidl-default-runtime
  run:
    - __glibc >=2.38
    - ros-jazzy-rosidl-default-runtime

tests:
  - package_contents:
      files:
        - share/negotiated_interfaces/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/negotiated
  summary: A package containing the negotiation message definitions.
  license: Apache-2.0
