schema_version: 1

# ros-jazzy-nvblox-ros, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_nvblox/nvblox_ros
# Detected build traits: ament_auto, cuda, magicenum.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-nvblox-ros
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nvblox/archive/refs/tags/v4.5-0.tar.gz
    sha256: 4a668d140bec4df889f1b1a0a1059d841c19546ec8ac7e26de830a694fc855b8
    target_directory: src
  - url: https://github.com/nvidia-isaac/nvblox/archive/24eee4948768682fa1ffb969b881efee4fca29c2.tar.gz
    sha256: b5243e56760fe1aaa4d029d71ed8dde34ee9f4ac84aa7de1c4fafcb32d27fc30
    target_directory: src/nvblox_ros/nvblox_core

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - export CXXFLAGS="${CXXFLAGS:-} -I${PREFIX}/include/magic_enum"
    - export CUDAFLAGS="${CUDAFLAGS:-} -I${PREFIX}/include/magic_enum"
    - cd src/nvblox_ros
    # ${CMAKE_ARGS} carries the compiler activation's CMAKE_FIND_ROOT_PATH, which is
    # what points find_package(CUDAToolkit) at the prefix rather than /usr/local/cuda.
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - benchmark
    - gflags
    - glog
    - ros-jazzy-ament-cmake
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-cv-bridge
    - ros-jazzy-geometry-msgs
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-isaac-ros-nitros-camera-info-type
    - ros-jazzy-isaac-ros-nitros-image-type
    - ros-jazzy-message-filters
    - ros-jazzy-nav-msgs
    - ros-jazzy-nvblox-msgs
    - ros-jazzy-nvblox-ros-common
    - ros-jazzy-nvblox-ros-python-utils
    - ros-jazzy-nvblox-rviz-plugin
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-components
    - ros-jazzy-rosbag2-cpp
    - ros-jazzy-sensor-msgs
    - ros-jazzy-std-msgs
    - ros-jazzy-std-srvs
    - ros-jazzy-tf2-eigen
    - ros-jazzy-tf2-ros
    - ros-jazzy-visualization-msgs
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
    - magic_enum
  run:
    - __glibc >=2.38
    - benchmark
    - gflags
    - glog
    - ros-jazzy-cv-bridge
    - ros-jazzy-geometry-msgs
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-isaac-ros-nitros
    - ros-jazzy-isaac-ros-nitros-camera-info-type
    - ros-jazzy-isaac-ros-nitros-image-type
    - ros-jazzy-message-filters
    - ros-jazzy-nav-msgs
    - ros-jazzy-nvblox-msgs
    - ros-jazzy-nvblox-ros-common
    - ros-jazzy-nvblox-ros-python-utils
    - ros-jazzy-nvblox-rviz-plugin
    - ros-jazzy-rclcpp
    - ros-jazzy-rclcpp-components
    - ros-jazzy-rosbag2-cpp
    - ros-jazzy-sensor-msgs
    - ros-jazzy-std-msgs
    - ros-jazzy-std-srvs
    - ros-jazzy-tf2-eigen
    - ros-jazzy-tf2-ros
    - ros-jazzy-visualization-msgs

tests:
  - package_contents:
      files:
        - share/nvblox_ros/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nvblox
  summary: "NVBlox ROS 2 interface"
  license: Apache-2.0
