schema_version: 1

# ros-jazzy-nvblox-test-data, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_nvblox/nvblox_test_data
# Detected build traits: ament_auto, asset, cuda.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-nvblox-test-data
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nvblox/archive/refs/tags/v4.5-0.tar.gz
    sha256: 4a668d140bec4df889f1b1a0a1059d841c19546ec8ac7e26de830a694fc855b8
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - cd src/nvblox_test_data
    # See scripts/gen_source.py: install_isaac_ros_asset() would download
    # model weights and run trtexec during the build. Keep the ament
    # resource, drop the download -- assets belong on the target machine.
    - grep -q 'install_isaac_ros_asset(quickstart)' CMakeLists.txt || { echo 'install_isaac_ros_asset(quickstart) not found -- upstream changed shape, revisit gen_source.py'; exit 1; }
    - >
      sed -i 's|install_isaac_ros_asset(\([A-Za-z0-9_]*\))|ament_index_register_resource("\1" CONTENT "${CMAKE_INSTALL_PREFIX}/lib/${PROJECT_NAME}/\1.sh")\ninstall(PROGRAMS asset_scripts/\1.sh DESTINATION lib/${PROJECT_NAME})|'
      CMakeLists.txt
    # ${CMAKE_ARGS} carries the compiler activation's CMAKE_FIND_ROOT_PATH, which is
    # what points find_package(CUDAToolkit) at the prefix rather than /usr/local/cuda.
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-ament-cmake-auto
    - ros-jazzy-isaac-ros-common
    - cuda-version 13.*
    - cuda-cudart-dev
    - cuda-nvtx-dev
  run:
    - __glibc >=2.38
    - ros-jazzy-isaac-ros-common

tests:
  - package_contents:
      files:
        - share/nvblox_test_data/package.xml
        - lib/nvblox_test_data/quickstart.sh
        - share/ament_index/resource_index/quickstart/nvblox_test_data

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_nvblox
  summary: "Example data for use in the Isaac ROS nvblox package."
  license: Apache-2.0
