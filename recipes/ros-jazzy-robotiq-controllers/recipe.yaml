schema_version: 1

# ros-jazzy-robotiq-controllers, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: robotiq_controllers/.
# No special build traits detected.

context:
  version: "0.0.1"

package:
  name: ros-jazzy-robotiq-controllers
  version: ${{ version }}

source:
  - url: https://github.com/ros2-gbp/ros2_robotiq_gripper-release/archive/refs/tags/release/jazzy/robotiq_controllers/0.0.1-3.tar.gz
    sha256: e429584dc4ededa45c8a75cdc760a55460e91326c6e8e5f81b1d9fc8fd8c167b
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - cd src/.
    # ${CMAKE_ARGS} carries the compiler activation's CMAKE_FIND_ROOT_PATH, which is
    # what points find_package(CUDAToolkit) at the prefix rather than /usr/local/cuda.
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-ament-cmake
    - ros-jazzy-controller-interface
    - ros-jazzy-std-srvs
  run:
    - __glibc >=2.38
    - ros-jazzy-controller-interface
    - ros-jazzy-std-srvs

tests:
  - package_contents:
      files:
        - share/robotiq_controllers/package.xml

about:
  homepage: https://github.com/PickNikRobotics/ros2_robotiq_gripper
  summary: "Controllers for the Robotiq gripper."
  license: BSD-3-Clause
