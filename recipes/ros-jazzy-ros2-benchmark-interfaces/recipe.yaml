schema_version: 1

# ros-jazzy-ros2-benchmark-interfaces, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: ros2_benchmark/ros2_benchmark_interfaces
# Detected build traits: ament_auto, python, rosidl.

context:
  version: "4.5.0"

package:
  name: ros-jazzy-ros2-benchmark-interfaces
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/ros2_benchmark/archive/refs/tags/v4.5-0.tar.gz
    sha256: 9077a56c57337a7d34a5da1068d06e9b2ed550180e8566012e93f6f6dd1d4d63
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - export CMAKE_PREFIX_PATH="${PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
    - cd src/ros2_benchmark_interfaces
    - >
      cmake -S . -B build -G Ninja ${CMAKE_ARGS:-}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX="${PREFIX}"
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
      -DPYTHON_EXECUTABLE="${PREFIX}/bin/python"
      -DBUILD_TESTING=OFF
    - cmake --build build --parallel "${CPU_COUNT:-2}"
    - cmake --install build
  dynamic_linking:
    missing_dso_allowlist:
      # GXF extensions live in sibling packages' share/ trees; cuVSLAM and the VPI
      # backends are dlopen'd or resolved through the ament index.
      - libgxf_*.so
      - libcuvslam.so
      - libcumotion.so*
      - libnvvpi.so.*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-rosidl-default-generators
    - ros-jazzy-rosidl-default-runtime
    - ros-jazzy-ament-cmake-auto
    - python
    - pyyaml
    # isaac_ros_common-extras.cmake calls find_package(CUDAToolkit REQUIRED)
    # for every consumer, so a CUDA toolkit is needed even where this package
    # uses no CUDA of its own.
    - cuda-version 13.*
    - cuda-cudart-dev
  run:
    - __glibc >=2.38
    - ros-jazzy-isaac-ros-common
    - ros-jazzy-rosidl-default-runtime

tests:
  - package_contents:
      files:
        - share/ros2_benchmark_interfaces/package.xml

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/ros2_benchmark
  summary: Interfaces for benchmark testing
  license: Apache-2.0
