schema_version: 1

# NVIDIA TensorRT 10, repacked from the official CUDA and Jetson apt repositories.
#
# This is what `isaac_ros_tensor_rt` needs, and through it every DNN inference pipeline
# in Isaac ROS: RT-DETR, YOLOv8, DetectNet, Grounding DINO, DOPE, CenterPose, ESS depth
# and FoundationPose all run their models through a TensorRT node. It was the widest
# remaining blocker in the repo -- see README.md.
#
# NVIDIA granted permission to redistribute these binaries from this repository's
# channel. That permission is why the recipe lives in recipes/ rather than in
# external/staged-recipes/: conda-forge cannot take TensorRT without a redistribution
# grant of its own.
#
# ---------------------------------------------------------------------------
# Why deb sources, and not the tarball or Python wheel
# ---------------------------------------------------------------------------
# NVIDIA's generic CUDA 13 aarch64 artifacts are SBSA builds, not native Jetson
# builds. The r39.2 Jetson-common repository supplies TensorRT 10.16.2 for CUDA 13.2;
# direct cuobjdump inspection found 55 native SM87 cubins in libnvinfer and 63 in
# libnvinfer_plugin. The Orin variant therefore uses that payload and verifies the
# actual SASS inventory rather than inferring support from an aarch64 filename.
#
# conda-forge staged-recipes#29445 builds from
# TensorRT-<v>.Linux.x86_64-gnu.cuda-<x>.tar.gz. That tarball is **6.18 GB** and
# extracts to roughly 14 GB, because it carries the static archives --
# libnvinfer_static.a alone is 3.6 GB, libnvinfer_lean_static.a another 1.1 GB -- plus
# samples, data, docs and a 1 GB Windows builder resource. A GitHub runner has ~14 GB
# free in total, so a source that size cannot be unpacked in CI at all.
#
# The debs carry exactly the same shared objects, split, and total 1.45 GB. We need four
# of the eighteen: the runtime library, the plugin library, the ONNX parser and the
# headers. libnvinfer-dev is deliberately absent -- it is 2.5 GB of static archives and
# nothing here links statically.
#
# ---------------------------------------------------------------------------
# Why CUDA 13 TensorRT, not the 10.9.0.34 + cuda12.8 that Isaac ships against
# ---------------------------------------------------------------------------
# NVIDIA's own libnvinfer10 deb for Isaac ROS 4.5 is 10.9.0.34-1+cuda12.8, and README.md
# notes the oddity: the rest of Isaac ROS 4.5 is CUDA 13 while its TensorRT is the CUDA
# 12.8 build. Taking that at face value does not work here, and the reason is mechanical
# rather than a matter of taste.
#
# A CUDA 12.8 TensorRT links libcudart.so.12. Every package already built in this repo
# carries `cuda-cudart >=13.3.29`, which is `libcudart.so.13`, and conda-forge ships both
# majors under the *same package name* -- cuda-cudart 12.x and 13.x cannot coexist in one
# environment. So a cuda-12.8 TensorRT is not installable next to the rest of the stack;
# it is not a compatibility judgement, the environment simply does not solve.
#
# TensorRT 10 keeps the libnvinfer.so.10 soname expected by Isaac's binaries while
# NVIDIA publishes CUDA 13 builds for every target. Workstations and Thor use 10.13.3;
# Orin uses the native r39.2 10.16.2 build because the generic ARM artifact lacks SM87
# SASS. Engine plans are not portable between these releases, so users must rebuild
# rather than moving .plan files between this channel and NVIDIA's 10.9 installation.
#
# ---------------------------------------------------------------------------
# What is in the package
# ---------------------------------------------------------------------------
# FindTENSORRT.cmake (shipped in isaac_ros_common) does find_path for NvInferVersion.h and
# find_library for nvinfer, nvinfer_plugin and nvonnxparser, then builds three imported
# targets. All six inputs are here.
#
# The builder resources are most of the package and are not optional: libnvinfer dlopens
# them whenever it builds an engine, precisely what isaac_ros_tensor_rt does with ONNX
# models. TensorRT 10.13 has one monolithic resource; 10.16 splits it by GPU family.

context:
  # Orin on JetPack 7/r39 needs NVIDIA's native Tegra build. Other platforms stay on
  # 10.13.3 to avoid an unnecessary ABI change.
  version: ${{ "10.16.2.10" if target_platform == "linux-aarch64" and tensorrt_flavor == "orin" else "10.13.3.9" }}
  # The soname triple as it appears in the file names. Spelled out rather than derived:
  # rattler-build's jinja has no string .split().
  lib_version: ${{ "10.16.2" if target_platform == "linux-aarch64" and tensorrt_flavor == "orin" else "10.13.3" }}
  deb_version: ${{ "10.16.2.10-1+cuda13.2" if target_platform == "linux-aarch64" and tensorrt_flavor == "orin" else "10.13.3.9-1+cuda13.0" }}
  deb_arch: ${{ "arm64" if target_platform == "linux-aarch64" else "amd64" }}
  pool: ${{ "https://repo.download.nvidia.com/jetson/common/pool/main/t/tensorrt" if target_platform == "linux-aarch64" else "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64" }}
  build_number: ${{ 0 if target_platform == "linux-aarch64" and tensorrt_flavor == "orin" else 2 }}

package:
  name: tensorrt
  version: ${{ version }}

source:
  # `file_name` stops rattler-build from trying to unpack the .deb itself -- build.sh
  # does that with bsdtar, the same way recipes/vpi does.
  - url: ${{ pool }}/libnvinfer10_${{ deb_version }}_${{ deb_arch }}.deb
    file_name: libnvinfer10.deb
    sha256: ${{ "d02111e3600d91bef407fe537a4179445cdc73fb259bf1f83dd256804de1897e" if target_platform == "linux-aarch64" and tensorrt_flavor == "orin" else "c153dd67175d12661437d5bc9b573344467bc716c03133bc77ed1befa820eac6" if target_platform == "linux-aarch64" else "bc99693fa55a62afc193b32b1eecb18006393ff2959d95a737683b6c238ab546" }}
  - url: ${{ pool }}/libnvinfer-plugin10_${{ deb_version }}_${{ deb_arch }}.deb
    file_name: libnvinfer-plugin10.deb
    sha256: ${{ "a19ba2f43860e768045947f59a63fecd1464feeba353bfb6a096985b3a634710" if target_platform == "linux-aarch64" and tensorrt_flavor == "orin" else "0af6f955b17da27fc94284cdd39a67b6702452bc8bc8587f9f6a63be58ca1f71" if target_platform == "linux-aarch64" else "7a40cdf6618b7e25f716554d0804632677e46df3503e5d8dfa50c62940f8517f" }}
  - url: ${{ pool }}/libnvonnxparsers10_${{ deb_version }}_${{ deb_arch }}.deb
    file_name: libnvonnxparsers10.deb
    sha256: ${{ "f146cbcc4d5d0d29f2c0123dd6a4b16ed1159eff27d03beeab27bbe9a766bff8" if target_platform == "linux-aarch64" and tensorrt_flavor == "orin" else "64c34bd51d057c048baa7c055ab676e20bb30100f3d63d3eb0ef3032d6686d4f" if target_platform == "linux-aarch64" else "1d4d48eca9ba5eafb2c48e1f62b0631194ac43967577666ed24b36b95d64184e" }}
  # Headers, in three packages. NvInferVersion.h is the one FindTENSORRT.cmake searches
  # for; NvInferPluginUtils.h is included directly by tensor_rt_node.cpp.
  - url: ${{ pool }}/libnvinfer-headers-dev_${{ deb_version }}_${{ deb_arch }}.deb
    file_name: libnvinfer-headers-dev.deb
    sha256: ${{ "6208dbba5dc7fd04ca1bca71a3dcaed6642cb08765edbfcc10996b52844b2ec9" if target_platform == "linux-aarch64" and tensorrt_flavor == "orin" else "61baa587776b5a074fc4bc794836b32c3fb4d0573ce7610389fc65f58ac0336b" if target_platform == "linux-aarch64" else "ddc5a6f2bc72e572141cf9f117604fe07ec0d01a59edfb411decdaa780dc4b08" }}
  - url: ${{ pool }}/libnvinfer-headers-plugin-dev_${{ deb_version }}_${{ deb_arch }}.deb
    file_name: libnvinfer-headers-plugin-dev.deb
    sha256: ${{ "951ebb46c7a33ff71dca064e62fab19c8ebdc4b895aa14027e6907113aa3e928" if target_platform == "linux-aarch64" and tensorrt_flavor == "orin" else "8e66fb552c748f7c890cf69eb7596d4a42ab48f916dfbc2036987a79aab43cd5" if target_platform == "linux-aarch64" else "a6b9d2f8adec9b158ba44cd6bd154cafcf4b4597f35ccc18b0093396218e1479" }}
  - url: ${{ pool }}/libnvonnxparsers-dev_${{ deb_version }}_${{ deb_arch }}.deb
    file_name: libnvonnxparsers-dev.deb
    sha256: ${{ "53bcf84f06c20f2b171379db79389d6680775a94c761b57ea7480134d0c038a7" if target_platform == "linux-aarch64" and tensorrt_flavor == "orin" else "c6345331c14119f0bd236b74c82dc967fdd6f9a55f489f626423b3d9268cdb55" if target_platform == "linux-aarch64" else "1efba486fcf795f4ebbb802ed3cf5e999ca6e75caed25c90b4920265e5ccc43e" }}

build:
  number: ${{ build_number }}
  # There is only one x86 payload; the second flavor is ARM-only.
  skip: target_platform != "linux-aarch64" and tensorrt_flavor == "orin"
  script: build.sh
  dynamic_linking:
    # NVIDIA's binaries are installed untouched -- no RPATH rewriting, no relinking, so
    # what ships here is byte-identical to the deb payload. build.sh asserts that.
    binary_relocation: false
    missing_dso_allowlist:
      # libnvinfer NEEDs libcudart/libcublas/libcublasLt, which are real run deps below
      # and resolve inside the prefix. libnvinfer_builder_resource is dlopen'd, not
      # linked, so it never appears in a NEEDED list. libnvdla_compiler and
      # libnvdla_runtime are Jetson DLA stubs with no x86_64 counterpart.
      - libnvdla_compiler.so
      - libnvdla_runtime.so

requirements:
  build:
    - libarchive          # bsdtar reads .deb (ar) archives
    - cuda-cuobjdump      # prove that the native Orin deb contains SM87 SASS
  run:
    # Ubuntu 24.04 build, so the binaries reference GLIBC_2.38.
    - __glibc >=2.38
    # Read off libnvinfer.so.10's own DT_NEEDED, not off the debs: libnvinfer10 declares
    # no apt Depends at all, and libnvinfer-plugin10/libnvonnxparsers10 declare only
    # libnvinfer10, so the manifests say nothing useful about the CUDA runtime.
    #
    # The cuda-version pin is the constraint the whole version choice above exists to
    # satisfy -- it is what makes this installable beside a stack that already requires
    # cuda-cudart >=13.3.29.
    - cuda-version 13.*
    - cuda-cudart
    - libcublas
  # Select the verified CUDA 13 ARM payload when the machine advertises a GPU
  # compute capability. Keep this a constraint rather than a hard dependency so
  # packages can still be built and inspected on GPU-less ARM CI runners.
  run_constraints:
    - ${{ "__cuda_arch >=8.7,<8.8" if target_platform == "linux-aarch64" and tensorrt_flavor == "orin" else "__cuda_arch >=11" if target_platform == "linux-aarch64" else "__unix" }}

tests:
  - package_contents:
      lib:
        # Matches libnvinfer.so / .so.10 / .so.10.13.3
        - nvinfer
        - nvinfer_plugin
        - nvonnxparser
      include:
        # The header FindTENSORRT.cmake keys its version detection on, and the one
        # tensor_rt_node.cpp includes directly.
        - NvInferVersion.h
        - NvInferPluginUtils.h
        - NvOnnxParser.h
  # A file list is not enough for this package: the builder resource is dlopen'd rather
  # than linked, so nothing about the ELF metadata would notice if it went missing, and
  # the failure would surface only when a node first tries to build an engine.
  - script:
      - find "${PREFIX}/lib" -maxdepth 1 -name 'libnvinfer_builder_resource*.so.*' -print -quit | grep -q .
      - python -c "import ctypes; ctypes.CDLL('libnvinfer.so.10')"
    requirements:
      run:
        - python

about:
  homepage: https://developer.nvidia.com/tensorrt
  summary: NVIDIA TensorRT runtime, plugin and ONNX parser libraries
  description: |
    Repacked from NVIDIA's official CUDA apt repositories and redistributed from this
    channel with NVIDIA's permission. Contains the TensorRT 10 runtime (libnvinfer),
    the plugin library, the ONNX parser and the headers -- enough to build and run
    isaac_ros_tensor_rt and every Isaac ROS DNN pipeline above it.
  # No SPDX identifier exists for the TensorRT terms, hence the LicenseRef. The debs
  # install NVIDIA's license text under share/doc/, which build.sh preserves.
  license: LicenseRef-NVIDIA-TensorRT
  license_file: LICENSE
