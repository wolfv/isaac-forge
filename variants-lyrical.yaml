# Pass together with variants.yaml, without -c flags: channel_sources both selects
# the Lyrical channel and participates in the rattler-build variant hash.
channel_sources:
  - ./output-lyrical,https://prefix.dev/robostack-lyrical,conda-forge
# RoboStack Lyrical's ROS Python packages (including rclcpp's ABI closure) use 3.14.
python:
  - "3.14.* *_cpython"
