[workspace]
name = "isaac-forge-verify"
channels = ["../output", "https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

# The repacked Isaac binaries are built on Ubuntu 24.04 and reference GLIBC_2.38
# symbols, which the packages declare as `__glibc >=2.38`. pixi's default glibc
# floor is lower, so a consumer has to raise it explicitly.
[system-requirements]
libc = { family = "glibc", version = "2.38" }

[dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-rclcpp-components = "*"
ros-jazzy-isaac-ros-visual-slam = "*"
ros-jazzy-isaac-ros-image-proc = "*"
python = "3.12.*"
